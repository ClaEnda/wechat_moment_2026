name: Windows portable build

on:
  push:
    branches:
      - "build/windows-portable-2026"
      - "feature/sns-likes-comments"
      - "feature/multi-account-profiles"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/main_portable.spec
          $app = Join-Path $env:GITHUB_WORKSPACE "dist\wechat_moments"
          if (!(Test-Path (Join-Path $app "wechat_moments.exe"))) {
            throw "PyInstaller did not produce wechat_moments.exe"
          }

      - name: Assemble portable environment and resources
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "dist\wechat_moments"
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "resource") -Destination (Join-Path $app "resource") -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "README.md") -Destination $app -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $app -Force
          @'
          微信朋友圈导出工具 - Windows 便携版

          使用前提：
          1. Windows 10/11 64 位系统。
          2. 安装并登录电脑版微信 4.1。
          3. 仅备份本人有权访问的朋友圈内容，并遵守项目许可证及隐私法律规定。

          使用方法：
          双击 wechat_moments.exe 启动。请保持微信处于登录状态。
          程序导出的 HTML 和媒体文件保存在程序目录下的 output 文件夹。

          说明：
          本程序采用目录式便携打包。wechat_moments.exe 不能单独从文件夹中抽出运行；
          resource 文件夹及同目录的运行库文件必须与 exe 一起保留。
          '@ | Set-Content -LiteralPath (Join-Path $app "运行说明.txt") -Encoding UTF8

          $mustHave = @(
            (Join-Path $app "resource\ffmpeg.exe"),
            (Join-Path $app "resource\ffprobe.exe"),
            (Join-Path $app "resource\template.html")
          )
          foreach ($file in $mustHave) {
            if (!(Test-Path $file)) { throw "Missing required resource: $file" }
          }

          $zip = Join-Path $env:GITHUB_WORKSPACE "dist\WechatMoments-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $app "*") -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File (Join-Path $env:GITHUB_WORKSPACE "dist\SHA256.txt")

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: WechatMoments-Windows-x64
          path: |
            dist/WechatMoments-Windows-x64.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
